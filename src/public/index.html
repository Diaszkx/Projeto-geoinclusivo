<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>GeoInclusivo</title><link rel="stylesheet" href="/css/style.css"/></head><body><header class="header"><h1>GeoInclusivo</h1><p>Quiz geográfico acessível para aprender de forma simples e interativa.</p></header><main class="container"><section class="card"><h2>Iniciar Quiz</h2><label for="nome">Seu nome</label><input id="nome" type="text" placeholder="Digite seu nome"/><label for="email">E-mail opcional</label><input id="email" type="email" placeholder="Digite seu e-mail"/><label for="categoria">Categoria</label><select id="categoria"><option value="">Todas as categorias</option></select><button id="btnIniciar">Iniciar</button></section><section id="quiz" class="card hidden"><h2>Perguntas</h2><form id="quizForm"></form><button id="btnFinalizar">Finalizar Quiz</button></section><section id="resultado" class="card hidden" aria-live="polite"></section><section class="card"><h2>Histórico de Tentativas</h2><button id="btnHistorico">Atualizar histórico</button><div id="historico"></div></section></main><script src="/js/app.js"></script></body></html>
